apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-user
  namespace: donaton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-user
  template:
    metadata:
      labels:
        app: ms-user
    spec:
      containers:
        - name: ms-user
          image: donaton-platform-ms-user:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: donaton-db-secrets
                  key: USER_DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: donaton-db-secrets
                  key: USER_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: donaton-db-secrets
                  key: USER_DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

