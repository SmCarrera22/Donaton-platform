spring.application.name=campaign-test

# Base de datos temporal para pruebas
spring.datasource.url=jdbc:h2:mem:campaign_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y elimina las tablas durante las pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway se prueba indirectamente en ejecución real.
# En testing dejamos que Hibernate genere el esquema H2.
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info