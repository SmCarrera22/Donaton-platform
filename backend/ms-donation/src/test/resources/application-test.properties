spring.application.name=donation-test

server.port=0

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:donation_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway se desactiva en testing
spring.flyway.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger no es necesario durante los tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false